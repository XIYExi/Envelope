name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 Node >= 18（与仓库 engines 对齐）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 使用 Corepack 启用 pnpm，并固定到仓库 packageManager 版本
      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      # 读取 pnpm store 的实际路径（不同系统/版本路径可能不同）
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # 缓存 pnpm store，加速后续安装依赖
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 安装依赖（不做 lint / build，只做本次 CI 所需任务）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 仅跑 engine / generator / platform 的 Vitest 单测（避免把其它包的测试也纳入 CI）
      - name: Unit tests (Vitest)
        run: pnpm turbo test --filter=@envelope/engine --filter=@envelope/generator --filter=@envelope/platform

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # e2e 运行时开放 /__e2e__ 路由前缀（仅测试用途）
      ENABLE_E2E_ROUTES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 安装 Playwright 所需浏览器与系统依赖（CI 环境必须显式安装）
      - name: Install Playwright browsers
        run: pnpm --filter @envelope/platform exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm --filter @envelope/platform e2e
